<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>FitManager Pro - Physique</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0,1" />
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <style>
        :root {
            --bg-color: #000000;
            --container-bg: rgba(20, 20, 20, 0.9);
            --card-bg: rgba(30, 30, 30, 0.98);
            --text-primary: #ffffff;
            --text-secondary: #b0b0b0;
            --accent-color: #feeb1a;
            --neon-glow: 0 0 15px rgba(254, 235, 26, 0.5);
            --border-color: rgba(254, 235, 26, 0.2);
            --glass-border: rgba(255, 255, 255, 0.05);
            --transition: all 0.3s ease;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { 
            background: var(--bg-color); 
            color: var(--text-primary); 
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
        }

        .app-container {
            width: 100%;
            max-width: 1000px;
            background: var(--container-bg);
            backdrop-filter: blur(20px);
            border-radius: 2rem;
            padding: 2rem;
            border: 1px solid var(--glass-border);
            margin: 20px 10px;
            min-height: 85vh;
        }

        header { text-align: center; margin-bottom: 2.5rem; }
        .logo-img { width: 100px; filter: drop-shadow(var(--neon-glow)); margin-bottom: 15px; }
        h1 { color: var(--accent-color); text-transform: uppercase; letter-spacing: 2px; font-size: 2.2rem; }

        .quick-actions {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 15px;
        }
        .btn-action {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            color: #fff;
            padding: 22px 10px;
            border-radius: 1.5rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            transition: var(--transition);
        }
        .btn-action:hover { background: var(--accent-color); color: #000; box-shadow: var(--neon-glow); transform: translateY(-3px); }
        .btn-action span { font-size: 2.2rem; }

        .btn-payment-special {
            grid-column: 1 / -1;
            background: var(--accent-color);
            color: #000;
            font-weight: 900;
            padding: 22px;
            border-radius: 1.5rem;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            margin-bottom: 10px;
            box-shadow: var(--neon-glow);
            text-transform: uppercase;
            font-size: 1.1rem;
        }

        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.92);
            backdrop-filter: blur(12px);
            z-index: 100000;
            justify-content: center;
            align-items: center;
            padding: 15px;
        }
        .modal-content {
            background: var(--card-bg);
            padding: 2.5rem 1.8rem;
            border-radius: 2.5rem;
            width: 100%;
            max-width: 580px;
            max-height: 92vh;
            overflow-y: auto;
            border: 1px solid var(--border-color);
            position: relative;
        }

        .student-item {
            background: rgba(255,255,255,0.04);
            padding: 18px;
            border-radius: 18px;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid rgba(255,255,255,0.05);
        }
        .student-item.paid { border-left: 6px solid #2ed573; }
        .student-item.unpaid { border-left: 6px solid #ff4757; }

        input, select, textarea {
            width: 100%;
            background: #111;
            border: 1px solid #333;
            color: #fff;
            padding: 16px;
            border-radius: 15px;
            margin-bottom: 18px;
            font-size: 1rem;
        }
        button.primary { width: 100%; background: var(--accent-color); color: #000; border: none; padding: 18px; border-radius: 15px; font-weight: 900; cursor: pointer; text-transform: uppercase; }

        #sheetStatus { font-size: 0.85rem; opacity: 0.7; margin-top: 2.5rem; text-align: center; }

        @media (max-width: 600px) {
            .app-container { padding: 1.5rem 1rem; border-radius: 1.5rem; }
            .quick-actions { grid-template-columns: 1fr 1fr; }
            h1 { font-size: 1.8rem; }
        }
    </style>
</head>
<body>

<div class="app-container">
    <header>
        <img src="https://lh3.googleusercontent.com/d/14YQ4fB_3oU9u7yP5mX_yQyvD5_D6zX-7" class="logo-img">
        <h1>Physique</h1>
        <p style="opacity:0.7; font-size:0.9rem; margin-top:5px;">Centro de Treinamento e Evolução</p>
    </header>

    <div id="unauthenticatedView">
        <div style="text-align:center; padding: 3rem 1rem; background: rgba(255,255,255,0.02); border-radius: 2rem;">
            <h2 style="color:var(--accent-color); margin-bottom:1rem;">Área do Professor</h2>
            <p style="margin-bottom:2.5rem; opacity:0.8;">Acesse com sua conta Google para sincronizar os dados da academia.</p>
            <div id="googleLoginBtnWrapper"></div>
        </div>
    </div>

    <div id="authenticatedView" style="display:none;">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:2.5rem; background:rgba(255,255,255,0.05); padding:12px 25px; border-radius:60px; border: 1px solid var(--glass-border);">
            <div style="display:flex; align-items:center; gap:12px;">
                <img id="userAvatar" src="" style="width:40px; height:40px; border-radius:50%; border: 2px solid var(--accent-color);">
                <span id="userEmailSpan" style="font-size:0.9rem; font-weight:600;"></span>
            </div>
            <button onclick="location.reload()" style="background:#ff4757; border:none; color:#fff; padding:8px 20px; border-radius:50px; cursor:pointer; font-size:0.8rem; font-weight:bold;">SAIR</button>
        </div>

        <div class="quick-actions">
            <button class="btn-payment-special" onclick="openFinanceModal()">
                <span class="material-symbols-outlined">payments</span>
                REGISTRAR PAGAMENTOS (NOVO)
            </button>
            <button class="btn-action" onclick="openModal('modalAttendance')">
                <span class="material-symbols-outlined">fitness_center</span>Presença
            </button>
            <button class="btn-action" onclick="openModal('modalNewStudent')">
                <span class="material-symbols-outlined">person_add</span>Novo Aluno
            </button>
            <button class="btn-action" onclick="openModal('modalObservation')">
                <span class="material-symbols-outlined">edit_note</span>Notas
            </button>
            <button class="btn-action" onclick="openModal('modalEvaluation')">
                <span class="material-symbols-outlined">vital_signs</span>Avaliação
            </button>
            <button class="btn-action" onclick="openModal('modalReports')">
                <span class="material-symbols-outlined">monitoring</span>Relatórios
            </button>
        </div>
        <div id="sheetStatus">🔄 Conectando...</div>
    </div>
</div>

<div id="modalAttendance" class="modal">
    <div class="modal-content">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:2rem;">
            <h3 style="color:var(--accent-color); font-size:1.5rem;">Presença de Hoje</h3>
            <span class="material-symbols-outlined" onclick="closeModal('modalAttendance')" style="cursor:pointer; color:#ff4757;">close</span>
        </div>
        <div id="studentsListContainer"></div>
    </div>
</div>

<div id="modalFinance" class="modal">
    <div class="modal-content">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:2rem;">
            <h3 style="color:var(--accent-color); font-size:1.5rem;">Pagamentos Mensais</h3>
            <span class="material-symbols-outlined" onclick="closeModal('modalFinance')" style="cursor:pointer; color:#ff4757;">close</span>
        </div>
        <div id="financeListContainer"></div>
    </div>
</div>

<div id="modalNewStudent" class="modal">
    <div class="modal-content">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:2rem;">
            <h3 style="color:var(--accent-color); font-size:1.5rem;">Novo Cadastro</h3>
            <span class="material-symbols-outlined" onclick="closeModal('modalNewStudent')" style="cursor:pointer; color:#ff4757;">close</span>
        </div>
        <input type="text" id="studentName" placeholder="Nome Completo do Aluno">
        <input type="text" id="studentPhone" placeholder="WhatsApp">
        <input type="text" id="studentGoal" placeholder="Objetivo Principal">
        <button class="primary" onclick="addStudent()">CADASTRAR AGORA</button>
    </div>
</div>

<div id="modalObservation" class="modal">
    <div class="modal-content">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:2rem;">
            <h3 style="color:var(--accent-color); font-size:1.5rem;">Anotações</h3>
            <span class="material-symbols-outlined" onclick="closeModal('modalObservation')" style="cursor:pointer; color:#ff4757;">close</span>
        </div>
        <select id="studentSelectObs"></select>
        <textarea id="observationText" rows="5" placeholder="Evolução ou notas..."></textarea>
        <button class="primary" onclick="addObservation()">SALVAR NOTA</button>
    </div>
</div>

<div id="modalEvaluation" class="modal">
    <div class="modal-content">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:2rem;">
            <h3 style="color:var(--accent-color); font-size:1.5rem;">Avaliação Física</h3>
            <span class="material-symbols-outlined" onclick="closeModal('modalEvaluation')" style="cursor:pointer; color:#ff4757;">close</span>
        </div>
        <select id="studentSelectEval"></select>
        <div style="display:grid; grid-template-columns:1fr 1fr; gap:15px;">
            <input type="number" id="evalPeso" placeholder="Peso (kg)">
            <input type="number" id="evalAltura" placeholder="Altura (cm)">
        </div>
        <button class="primary" onclick="saveEvaluation()">GRAVAR AVALIAÇÃO</button>
    </div>
</div>

<div id="modalReports" class="modal">
    <div class="modal-content">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:2rem;">
            <h3 style="color:var(--accent-color); font-size:1.5rem;">Relatórios</h3>
            <span class="material-symbols-outlined" onclick="closeModal('modalReports')" style="cursor:pointer; color:#ff4757;">close</span>
        </div>
        <select id="studentSelectReportPDF"></select>
        <button class="primary" onclick="generateReport()">GERAR PDF INDIVIDUAL</button>
        <button class="primary" style="background:#333; color:#fff; margin-top:15px;" onclick="generateGeneralReport()">RELATÓRIO ACADEMIA</button>
    </div>
</div>

<script>
    const SHEET_NAMES = { STUDENTS: 'Alunos', ATTENDANCE: 'Presencas', OBSERVATIONS: 'Observacoes', EVALUATIONS: 'Avaliacoes', FINANCE: 'Financeiro' };
    let accessToken = null, spreadsheetId = null;
    let sheetDataCache = { students: [], attendances: [], finance: [] };

    function initializeGoogleLogin() {
        google.accounts.id.initialize({
            client_id: '115138407454-st6indfe1snrq3106nquqqmujv17js2t.apps.googleusercontent.com',
            callback: (res) => { initTokenClient(); }
        });
        google.accounts.id.renderButton(document.getElementById("googleLoginBtnWrapper"), { theme: "filled_black", size: "large", shape: "pill" });
    }

    function initTokenClient() {
        window.tokenClient = google.accounts.oauth2.initTokenClient({
            client_id: '115138407454-st6indfe1snrq3106nquqqmujv17js2t.apps.googleusercontent.com',
            scope: 'https://www.googleapis.com/auth/spreadsheets https://www.googleapis.com/auth/drive.file',
            callback: (res) => { accessToken = res.access_token; fetchUserInfo(); }
        });
        window.tokenClient.requestAccessToken();
    }

    async function fetchUserInfo() {
        const res = await fetch('https://www.googleapis.com/oauth2/v2/userinfo', { headers: { Authorization: `Bearer ${accessToken}` } });
        const user = await res.json();
        document.getElementById('userAvatar').src = user.picture;
        document.getElementById('userEmailSpan').innerText = user.email;
        document.getElementById('unauthenticatedView').style.display = 'none';
        document.getElementById('authenticatedView').style.display = 'block';
        await initSpreadsheet();
    }

    async function initSpreadsheet() {
        const status = document.getElementById('sheetStatus');
        status.innerText = "🔍 Localizando base de dados...";
        try {
            const search = await fetch(`https://www.googleapis.com/drive/v3/files?q=name='FitManager_Physique' and trashed=false`, { headers: { Authorization: `Bearer ${accessToken}` } });
            const data = await search.json();
            if (data.files && data.files.length > 0) {
                spreadsheetId = data.files[0].id;
            } else {
                status.innerText = "🆕 Criando estrutura...";
                const create = await fetch('https://sheets.googleapis.com/v4/spreadsheets', {
                    method: 'POST',
                    headers: { Authorization: `Bearer ${accessToken}`, 'Content-Type': 'application/json' },
                    body: JSON.stringify({ properties: { title: 'FitManager_Physique' }, sheets: Object.values(SHEET_NAMES).map(t => ({ properties: { title: t } })) })
                });
                const res = await create.json();
                spreadsheetId = res.spreadsheetId;
                await setupHeaders();
            }
            await loadData();
        } catch (e) { status.innerText = "❌ Falha ao conectar."; }
    }

    async function setupHeaders() {
        const h = { [SHEET_NAMES.STUDENTS]:['ID','Nome','WhatsApp','Objetivo','Data'], [SHEET_NAMES.ATTENDANCE]:['ID','AID','Data','Hora','Status'], [SHEET_NAMES.FINANCE]:['ID','AID','Data','Valor','Mes'] };
        for (const [n, v] of Object.entries(h)) {
            await fetch(`https://sheets.googleapis.com/v4/spreadsheets/${spreadsheetId}/values/${n}!A1:E1?valueInputOption=RAW`, { method: 'PUT', headers: { Authorization: `Bearer ${accessToken}` }, body: JSON.stringify({ values: [v] }) });
        }
    }

    async function loadData() {
        const status = document.getElementById('sheetStatus');
        status.innerText = "📥 Atualizando informações...";
        try {
            const read = async (n) => {
                const r = await fetch(`https://sheets.googleapis.com/v4/spreadsheets/${spreadsheetId}/values/${n}!A2:Z`, { headers: { Authorization: `Bearer ${accessToken}` } });
                const d = await r.json(); return d.values || [];
            };
            const [s, a, f] = await Promise.all([read(SHEET_NAMES.STUDENTS), read(SHEET_NAMES.ATTENDANCE), read(SHEET_NAMES.FINANCE)]);
            
            sheetDataCache.students = s.filter(r => r[0] && String(r[0]).startsWith('s_')).map(r => ({ id: r[0], nome: r[1] }));
            sheetDataCache.attendances = a.filter(r => r[0] && String(r[0]).startsWith('p_')).map(r => ({ aid: r[1], data: r[2], hora: r[3] }));
            sheetDataCache.finance = f.filter(r => r[0] && String(r[0]).startsWith('f_')).map(r => ({ aid: r[1], mes: r[4] }));

            renderAttendanceList();
            updateSelects();
            status.innerText = `📊 Online (${sheetDataCache.students.length} alunos)`;
        } catch (e) { status.innerText = "❌ Erro ao ler dados."; }
    }

    function renderAttendanceList() {
        const cont = document.getElementById('studentsListContainer');
        const today = new Date().toISOString().slice(0,10);
        cont.innerHTML = sheetDataCache.students.map(s => {
            const pres = sheetDataCache.attendances.filter(p => p.aid == s.id && p.data == today);
            return `<div class="student-item">
                <strong style="font-size:1.1rem;">${escapeHtml(s.nome)}</strong>
                <div style="display:flex; gap:8px;">
                    ${['17h','19h','Extra'].map(h => {
                        const ok = pres.some(p => p.hora == h);
                        return ok ? `<span style="color:#2ed573; font-weight:bold;">✅${h}</span>` : `<button onclick="markPres('${s.id}','${h}')" style="background:#333; color:#fff; border:none; padding:8px 12px; border-radius:10px; cursor:pointer;">${h}</button>`;
                    }).join('')}
                </div>
            </div>`;
        }).join('');
    }

    async function markPres(id, h) {
        await appendRow(SHEET_NAMES.ATTENDANCE, [`p_${Date.now()}`, id, new Date().toISOString().slice(0,10), h, 'Presente']);
        await loadData();
    }

    function openFinanceModal() {
        const cont = document.getElementById('financeListContainer');
        const month = new Date().toISOString().slice(0, 7);
        let p = 0, n = 0;
        const html = sheetDataCache.students.map(s => {
            const ok = sheetDataCache.finance.some(f => f.aid == s.id && f.mes == month);
            if (ok) p++; else n++;
            return `<div class="student-item ${ok?'paid':'unpaid'}">
                <div><strong>${escapeHtml(s.nome)}</strong><br><small>${ok?'✅ MENSALIDADE PAGA':'🔴 AGUARDANDO PAGAMENTO'}</small></div>
                ${!ok?`<button onclick="pay('${s.id}')" style="background:var(--accent-color); color:#000; border:none; padding:10px 18px; border-radius:12px; font-weight:bold; cursor:pointer;">💰 PAGAR</button>`:''}
            </div>`;
        }).join('');
        cont.innerHTML = `<div style="display:flex; justify-content:space-around; margin-bottom:2rem; background:rgba(255,255,255,0.05); padding:20px; border-radius:20px; text-align:center;">
            <div><div style="color:#2ed573; font-size:1.5rem; font-weight:bold;">${p}</div><small>Pagos</small></div>
            <div><div style="color:#ff4757; font-size:1.5rem; font-weight:bold;">${n}</div><small>Pendentes</small></div>
            <div><div style="color:var(--accent-color); font-size:1.5rem; font-weight:bold;">${sheetDataCache.students.length}</div><small>Alunos</small></div>
        </div>` + html;
        openModal('modalFinance');
    }

    async function pay(id) {
        if (!confirm("Registrar pagamento?")) return;
        await appendRow(SHEET_NAMES.FINANCE, [`f_${Date.now()}`, id, new Date().toISOString().slice(0,10), 'R$ 0,00', new Date().toISOString().slice(0,7)]);
        await loadData();
        openFinanceModal();
    }

    async function appendRow(name, row) {
        await fetch(`https://sheets.googleapis.com/v4/spreadsheets/${spreadsheetId}/values/${name}!A:A:append?valueInputOption=USER_ENTERED`, { method: 'POST', headers: { Authorization: `Bearer ${accessToken}`, 'Content-Type': 'application/json' }, body: JSON.stringify({ values: [row] }) });
    }

    function updateSelects() {
        ['studentSelectObs', 'studentSelectEval', 'studentSelectReportPDF'].forEach(id => {
            const el = document.getElementById(id);
            if(el) el.innerHTML = '<option value="">-- Selecione o Aluno --</option>' + sheetDataCache.students.map(s => `<option value="${s.id}">${escapeHtml(s.nome)}</option>`).join('');
        });
    }

    async function addStudent() {
        const n = document.getElementById('studentName').value;
        if (!n) return alert("Preencha o nome!");
        await appendRow(SHEET_NAMES.STUDENTS, [`s_${Date.now()}`, n, document.getElementById('studentPhone').value, document.getElementById('studentGoal').value, new Date().toISOString()]);
        document.getElementById('studentName').value = '';
        closeModal('modalNewStudent');
        await loadData();
    }

    async function addObservation() {
        const id = document.getElementById('studentSelectObs').value;
        const txt = document.getElementById('observationText').value;
        if (!id || !txt) return alert("Preencha tudo!");
        await appendRow(SHEET_NAMES.OBSERVATIONS, [`o_${Date.now()}`, id, new Date().toISOString(), txt]);
        document.getElementById('observationText').value = '';
        closeModal('modalObservation');
        await loadData();
    }

    async function saveEvaluation() {
        const id = document.getElementById('studentSelectEval').value;
        const p = document.getElementById('evalPeso').value;
        const a = document.getElementById('evalAltura').value;
        if (!id || !p || !a) return alert("Preencha tudo!");
        const imc = (p / ((a/100)*(a/100))).toFixed(1);
        await appendRow(SHEET_NAMES.EVALUATIONS, [`ev_${Date.now()}`, id, new Date().toISOString().slice(0,10), p, a, imc]);
        closeModal('modalEvaluation');
        await loadData();
    }

    function openModal(id) { document.getElementById(id).style.display = 'flex'; }
    function closeModal(id) { document.getElementById(id).style.display = 'none'; }
    function escapeHtml(str) { return str ? str.replace(/[&<>]/g, t => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[t] || t)) : ''; }
    window.onload = initializeGoogleLogin;

    async function generateReport() { alert("Manutenção."); }
    async function generateGeneralReport() { alert("Manutenção."); }
</script>
</body>
</html>
