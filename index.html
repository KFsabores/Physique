<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>FitManager Pro - Physique</title>
    <!-- Fontes e Bibliotecas -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0,1" />
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
    
    <style>
        :root {
            --bg-color: #000000;
            --container-bg: rgba(20, 20, 20, 0.9);
            --card-bg: rgba(30, 30, 30, 0.98);
            --text-primary: #ffffff;
            --text-secondary: #b0b0b0;
            --accent-color: #feeb1a;
            --neon-glow: 0 0 15px rgba(254, 235, 26, 0.5);
            --border-color: rgba(254, 235, 26, 0.2);
            --glass-border: rgba(255, 255, 255, 0.05);
            --transition: all 0.3s ease;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { 
            background: var(--bg-color); 
            color: var(--text-primary); 
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .app-container {
            width: 100%;
            max-width: 1100px;
            background: var(--container-bg);
            backdrop-filter: blur(25px);
            border-radius: 2.5rem;
            padding: 2.5rem;
            border: 1px solid var(--glass-border);
            margin: 20px 10px;
            min-height: 85vh;
            box-shadow: 0 25px 50px rgba(0,0,0,0.5);
        }

        header { text-align: center; margin-bottom: 2.5rem; position: relative; }
        .logo-img { width: 100px; filter: drop-shadow(var(--neon-glow)); margin-bottom: 10px; }
        h1 { color: var(--accent-color); text-transform: uppercase; letter-spacing: 2px; font-size: 2.2rem; font-weight: 800; text-shadow: var(--neon-glow); }

        .quick-actions {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 15px;
        }
        .btn-action {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            color: #fff;
            padding: 25px 15px;
            border-radius: 2rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            transition: var(--transition);
        }
        .btn-action:hover { border-color: var(--accent-color); box-shadow: var(--neon-glow); transform: translateY(-3px); }
        .btn-action span { font-size: 2.2rem; color: var(--accent-color); }

        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.94);
            backdrop-filter: blur(15px);
            z-index: 100000;
            justify-content: center;
            align-items: center;
            padding: 15px;
        }
        .modal-content {
            background: var(--card-bg);
            padding: 2.5rem;
            border-radius: 2.5rem;
            width: 100%;
            max-width: 650px;
            max-height: 92vh;
            overflow-y: auto;
            border: 1px solid var(--border-color);
            position: relative;
        }

        .student-item {
            background: rgba(255,255,255,0.04);
            padding: 18px;
            border-radius: 18px;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid rgba(255,255,255,0.05);
        }

        .presence-badge {
            background: #2ed573;
            color: #000;
            padding: 8px 12px;
            border-radius: 10px;
            font-size: 0.75rem;
            font-weight: 800;
            cursor: pointer;
            border: none;
        }

        .report-preview {
            background: rgba(0,0,0,0.3);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 20px;
            margin-top: 20px;
            font-size: 0.9rem;
            line-height: 1.6;
        }

        .report-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-top: 15px;
        }

        .report-section {
            background: rgba(255,255,255,0.03);
            padding: 12px;
            border-radius: 12px;
        }

        input[type="date"] {
            background: #111;
            color: var(--accent-color);
            border: 1px solid var(--border-color);
            padding: 10px;
            border-radius: 10px;
            margin-bottom: 15px;
            width: auto;
        }

        button.primary { width: 100%; background: var(--accent-color); color: #000; border: none; padding: 18px; border-radius: 15px; font-weight: 800; cursor: pointer; text-transform: uppercase; }

        @media (max-width: 600px) {
            .app-container { padding: 1.5rem; }
            .quick-actions { grid-template-columns: 1fr 1fr; }
            .report-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

<div class="app-container">
    <header>
        <img src="logo.png" class="logo-img" onerror="this.src='https://lh3.googleusercontent.com/d/14YQ4fB_3oU9u7yP5mX_yQyvD5_D6zX-7'">
        <h1>Physique</h1>
        <p style="opacity:0.7; font-size:0.9rem; margin-top:5px;">Centro de Treinamento e Evolução</p>
    </header>

    <div id="unauthenticatedView">
        <div style="text-align:center; padding: 3rem 1rem;">
            <div id="googleLoginBtnWrapper" style="display:flex; justify-content:center;"></div>
        </div>
    </div>

    <div id="authenticatedView" style="display:none;">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:2.5rem; background:rgba(255,255,255,0.05); padding:10px 25px; border-radius:60px; border: 1px solid var(--glass-border);">
            <div style="display:flex; align-items:center; gap:12px;">
                <img id="userAvatar" src="" style="width:35px; height:35px; border-radius:50%;">
                <span id="userEmailSpan" style="font-size:0.85rem;"></span>
            </div>
            <button onclick="location.reload()" style="background:#ff4757; border:none; color:#fff; padding:6px 15px; border-radius:20px; cursor:pointer; font-size:0.75rem;">SAIR</button>
        </div>

        <div class="quick-actions">
            <button class="btn-action" onclick="openModal('modalAttendance')">
                <span class="material-symbols-outlined">calendar_today</span>Presença
            </button>
            <button class="btn-action" onclick="openModal('modalFinance')">
                <span class="material-symbols-outlined">payments</span>Financeiro
            </button>
            <button class="btn-action" onclick="openModal('modalNewStudent')">
                <span class="material-symbols-outlined">person_add</span>Novo Aluno
            </button>
            <button class="btn-action" onclick="openModal('modalObservation')">
                <span class="material-symbols-outlined">edit_note</span>Notas
            </button>
            <button class="btn-action" onclick="openModal('modalEvaluation')">
                <span class="material-symbols-outlined">vital_signs</span>Avaliação
            </button>
            <button class="btn-action" onclick="openModal('modalReports')">
                <span class="material-symbols-outlined">monitoring</span>Relatórios
            </button>
        </div>
        <div id="sheetStatus" style="margin-top:20px; text-align:center; opacity:0.6; font-size:0.8rem;">🔄 Sincronizando...</div>
    </div>
</div>

<!-- MODAIS -->
<div id="modalAttendance" class="modal">
    <div class="modal-content">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:1.5rem;">
            <h3 style="color:var(--accent-color);">Chamada Diária</h3>
            <span class="material-symbols-outlined" onclick="closeModal('modalAttendance')" style="cursor:pointer; color:#ff4757;">close</span>
        </div>
        <div style="margin-bottom:15px; display:flex; align-items:center; gap:10px;">
            <label style="font-size:0.8rem; opacity:0.8;">Data:</label>
            <input type="date" id="attendanceDate" onchange="renderAttendanceList()">
        </div>
        <div id="studentsListContainer"></div>
    </div>
</div>

<div id="modalFinance" class="modal">
    <div class="modal-content">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:1.5rem;">
            <h3 style="color:var(--accent-color);">Financeiro</h3>
            <span class="material-symbols-outlined" onclick="closeModal('modalFinance')" style="cursor:pointer; color:#ff4757;">close</span>
        </div>
        <div id="financeListContainer"></div>
    </div>
</div>

<div id="modalNewStudent" class="modal">
    <div class="modal-content">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:1.5rem;">
            <h3 style="color:var(--accent-color);">Novo Aluno</h3>
            <span class="material-symbols-outlined" onclick="closeModal('modalNewStudent')" style="cursor:pointer; color:#ff4757;">close</span>
        </div>
        <input type="text" id="studentName" placeholder="Nome Completo">
        <input type="text" id="studentPhone" placeholder="WhatsApp">
        <input type="text" id="studentGoal" placeholder="Objetivo">
        <button class="primary" onclick="addStudent()">CADASTRAR</button>
    </div>
</div>

<div id="modalObservation" class="modal">
    <div class="modal-content">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:1.5rem;">
            <h3 style="color:var(--accent-color);">Notas de Treino</h3>
            <span class="material-symbols-outlined" onclick="closeModal('modalObservation')" style="cursor:pointer; color:#ff4757;">close</span>
        </div>
        <select id="studentSelectObs" onchange="showObsPreview(this.value)"></select>
        <div id="obsPreview" style="background:rgba(0,0,0,0.2); padding:12px; border-radius:12px; margin-bottom:12px; font-size:0.8rem; color:var(--text-secondary);">Selecione um aluno.</div>
        <textarea id="observationText" rows="3" placeholder="Nota de hoje..."></textarea>
        <button class="primary" onclick="addObservation()">SALVAR</button>
    </div>
</div>

<div id="modalEvaluation" class="modal">
    <div class="modal-content">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:1.5rem;">
            <h3 style="color:var(--accent-color);">Avaliação</h3>
            <span class="material-symbols-outlined" onclick="closeModal('modalEvaluation')" style="cursor:pointer; color:#ff4757;">close</span>
        </div>
        <select id="studentSelectEval"></select>
        <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px;">
            <input type="number" id="evalPeso" placeholder="Peso (kg)">
            <input type="number" id="evalAltura" placeholder="Altura (cm)">
            <input type="number" id="evalCintura" placeholder="Cintura (cm)">
            <input type="number" id="evalQuadril" placeholder="Quadril (cm)">
        </div>
        <button class="primary" onclick="saveEvaluation()">SALVAR</button>
    </div>
</div>

<div id="modalReports" class="modal">
    <div class="modal-content">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:1.5rem;">
            <h3 style="color:var(--accent-color);">Relatórios</h3>
            <span class="material-symbols-outlined" onclick="closeModal('modalReports')" style="cursor:pointer; color:#ff4757;">close</span>
        </div>
        <div style="display:flex; gap:10px; margin-bottom:15px;">
            <select id="studentSelectReportPDF" style="margin-bottom:0;"></select>
            <button onclick="generatePreview()" style="background:var(--accent-color); color:#000; border:none; padding:10px 15px; border-radius:10px; font-weight:bold; cursor:pointer;">VISUALIZAR</button>
        </div>
        <button onclick="generateGeneralPreview()" style="background:#333; color:#fff; border:none; padding:10px; border-radius:10px; width:100%; margin-bottom:20px; cursor:pointer;">RELATÓRIO GERAL ACADEMIA</button>
        
        <div id="reportPreviewContainer"></div>
    </div>
</div>

<script>
    const SHEET_NAMES = { STUDENTS: 'Alunos', ATTENDANCE: 'Presencas', OBSERVATIONS: 'Observacoes', EVALUATIONS: 'Avaliacoes', FINANCE: 'Financeiro' };
    let accessToken = null, spreadsheetId = null;
    let sheetDataCache = { students: [], attendances: [], observations: [], evaluations: [], finance: [] };

    function initializeGoogleLogin() {
        google.accounts.id.initialize({
            client_id: '115138407454-st6indfe1snrq3106nquqqmujv17js2t.apps.googleusercontent.com',
            callback: (res) => { initTokenClient(); }
        });
        google.accounts.id.renderButton(document.getElementById("googleLoginBtnWrapper"), { theme: "filled_black", size: "large", shape: "pill" });
    }

    function initTokenClient() {
        window.tokenClient = google.accounts.oauth2.initTokenClient({
            client_id: '115138407454-st6indfe1snrq3106nquqqmujv17js2t.apps.googleusercontent.com',
            scope: 'https://www.googleapis.com/auth/spreadsheets https://www.googleapis.com/auth/drive.file',
            callback: (res) => { accessToken = res.access_token; fetchUserInfo(); }
        });
        window.tokenClient.requestAccessToken();
    }

    async function fetchUserInfo() {
        const res = await fetch('https://www.googleapis.com/oauth2/v2/userinfo', { headers: { Authorization: `Bearer ${accessToken}` } });
        const user = await res.json();
        document.getElementById('userAvatar').src = user.picture;
        document.getElementById('userEmailSpan').innerText = user.email;
        document.getElementById('unauthenticatedView').style.display = 'none';
        document.getElementById('authenticatedView').style.display = 'block';
        document.getElementById('attendanceDate').value = new Date().toISOString().slice(0,10);
        await initSpreadsheet();
    }

    async function initSpreadsheet() {
        try {
            const search = await fetch(`https://www.googleapis.com/drive/v3/files?q=name='FitManager_Physique' and trashed=false`, { headers: { Authorization: `Bearer ${accessToken}` } });
            const data = await search.json();
            if (data.files && data.files.length > 0) {
                spreadsheetId = data.files[0].id;
                await loadData();
            } else { alert("Crie a planilha ou verifique o login."); }
        } catch (e) { console.error(e); }
    }

    async function loadData() {
        const status = document.getElementById('sheetStatus');
        status.innerText = "📥 Sincronizando...";
        try {
            const read = async (n) => {
                const r = await fetch(`https://sheets.googleapis.com/v4/spreadsheets/${spreadsheetId}/values/${n}!A1:Z`, { headers: { Authorization: `Bearer ${accessToken}` } });
                const d = await r.json(); return d.values || [];
            };
            const [s, a, o, e, f] = await Promise.all([read(SHEET_NAMES.STUDENTS), read(SHEET_NAMES.ATTENDANCE), read(SHEET_NAMES.OBSERVATIONS), read(SHEET_NAMES.EVALUATIONS), read(SHEET_NAMES.FINANCE)]);
            
            sheetDataCache.students = s.filter(r => r[0] && String(r[0]).startsWith('s_')).map((r, i) => ({ id: r[0], nome: r[1], whats: r[2], obj: r[3], row: i+1 }));
            sheetDataCache.attendances = a.filter(r => r[0] && String(r[0]).startsWith('p_')).map((r, i) => ({ id: r[0], aid: r[1], data: r[2], hora: r[3], row: i+2 }));
            sheetDataCache.observations = o.filter(r => r[0] && String(r[0]).startsWith('o_')).map(r => ({ aid: r[1], data: r[2], texto: r[3] }));
            sheetDataCache.evaluations = e.filter(r => r[0] && String(r[0]).startsWith('ev_')).map(r => ({ aid: r[1], data: r[2], peso: r[3], imc: r[5], cintura: r[6], quadril: r[7] }));
            sheetDataCache.finance = f.filter(r => r[0] && String(r[0]).startsWith('f_')).map(r => ({ aid: r[1], data: r[2], mes: r[4] }));

            renderAttendanceList();
            renderFinanceList();
            updateSelects();
            status.innerText = `📊 Online (${sheetDataCache.students.length} alunos)`;
        } catch (e) { status.innerText = "❌ Erro ao ler dados."; }
    }

    function renderAttendanceList() {
        const cont = document.getElementById('studentsListContainer');
        const selDate = document.getElementById('attendanceDate').value;
        cont.innerHTML = sheetDataCache.students.map(s => {
            const pres = sheetDataCache.attendances.filter(p => p.aid == s.id && p.data == selDate);
            return `<div class="student-item">
                <strong>${escapeHtml(s.nome)}</strong>
                <div style="display:flex; gap:8px;">
                    ${['17h','19h','Extra'].map(h => {
                        const rec = pres.find(p => p.hora == h);
                        return rec ? `<button class="presence-badge" onclick="togglePres('${rec.id}')">✅ ${h}</button>` : `<button onclick="markPres('${s.id}','${h}')" style="background:#333; color:#fff; border:none; padding:8px 12px; border-radius:10px; cursor:pointer;">${h}</button>`;
                    }).join('')}
                </div>
            </div>`;
        }).join('');
    }

    async function togglePres(id) {
        if (!confirm("Deseja desmarcar esta presença?")) return;
        const rec = sheetDataCache.attendances.find(a => a.id == id);
        await fetch(`https://sheets.googleapis.com/v4/spreadsheets/${spreadsheetId}/values/${SHEET_NAMES.ATTENDANCE}!A${rec.row}:Z${rec.row}:clear`, { method: 'POST', headers: { Authorization: `Bearer ${accessToken}` } });
        await loadData();
    }

    async function markPres(aid, h) {
        const row = [`p_${Date.now()}`, aid, document.getElementById('attendanceDate').value, h, 'Presente'];
        await fetch(`https://sheets.googleapis.com/v4/spreadsheets/${spreadsheetId}/values/${SHEET_NAMES.ATTENDANCE}!A:A:append?valueInputOption=USER_ENTERED`, { method: 'POST', headers: { Authorization: `Bearer ${accessToken}`, 'Content-Type': 'application/json' }, body: JSON.stringify({ values: [row] }) });
        await loadData();
    }

    function renderFinanceList() {
        const cont = document.getElementById('financeListContainer');
        const month = new Date().toISOString().slice(0, 7);
        cont.innerHTML = sheetDataCache.students.map(s => {
            const ok = sheetDataCache.finance.some(f => f.aid == s.id && f.mes == month);
            return `<div class="student-item ${ok?'paid':'unpaid'}">
                <div><strong>${escapeHtml(s.nome)}</strong><br><small>${ok?'PAGO':'PENDENTE'}</small></div>
                ${!ok?`<button onclick="pay('${s.id}')" style="background:var(--accent-color); color:#000; border:none; padding:8px 12px; border-radius:10px; font-weight:bold; cursor:pointer;">PAGAR</button>`:''}
            </div>`;
        }).join('');
    }

    async function pay(id) {
        await fetch(`https://sheets.googleapis.com/v4/spreadsheets/${spreadsheetId}/values/${SHEET_NAMES.FINANCE}!A:A:append?valueInputOption=USER_ENTERED`, { method: 'POST', headers: { Authorization: `Bearer ${accessToken}`, 'Content-Type': 'application/json' }, body: JSON.stringify({ values: [[`f_${Date.now()}`, id, new Date().toISOString().slice(0,10), '0', new Date().toISOString().slice(0,7)]] }) });
        await loadData();
    }

    // RELATÓRIOS
    function generatePreview() {
        const id = document.getElementById('studentSelectReportPDF').value;
        if(!id) return alert("Selecione um aluno!");
        const aluno = sheetDataCache.students.find(s => s.id == id);
        const pres = sheetDataCache.attendances.filter(a => a.aid == id);
        const obs = sheetDataCache.observations.filter(o => o.aid == id).slice(-3);
        const evals = sheetDataCache.evaluations.filter(e => e.aid == id).slice(-1)[0];
        const month = new Date().toISOString().slice(0, 7);
        const pago = sheetDataCache.finance.some(f => f.aid == id && f.mes == month);

        const html = `
            <div class="report-preview">
                <div style="display:flex; justify-content:space-between; align-items:center;">
                    <h2 style="color:var(--accent-color);">${aluno.nome}</h2>
                    <button onclick="downloadPDF('${id}')" style="background:transparent; color:#ff4757; border:1px solid #ff4757; border-radius:50%; width:40px; height:40px; cursor:pointer;" title="Baixar PDF">PDF</button>
                </div>
                <p><strong>WhatsApp:</strong> ${aluno.whats || '-'}</p>
                <p><strong>Objetivo:</strong> ${aluno.obj || '-'}</p>
                <div class="report-grid">
                    <div class="report-section"><strong>Frequência:</strong><br>${pres.length} aulas registradas</div>
                    <div class="report-section"><strong>Financeiro:</strong><br>${pago ? '✅ Pago este mês' : '🔴 Pendente'}</div>
                </div>
                <div style="margin-top:15px;"><strong>Últimas Notas:</strong><br>${obs.map(o => `• ${o.texto}`).join('<br>') || 'Sem notas.'}</div>
                ${evals ? `<div style="margin-top:15px;"><strong>Últimas Medidas:</strong><br>Peso: ${evals.peso}kg | IMC: ${evals.imc}<br>Cintura: ${evals.cintura}cm | Quadril: ${evals.quadril}cm</div>` : ''}
            </div>`;
        document.getElementById('reportPreviewContainer').innerHTML = html;
    }

    function generateGeneralPreview() {
        const month = new Date().toISOString().slice(0, 7);
        const pagosCount = sheetDataCache.finance.filter(f => f.mes == month).length;
        const presCount = sheetDataCache.attendances.length;

        const html = `
            <div class="report-preview">
                <div style="display:flex; justify-content:space-between; align-items:center;">
                    <h2 style="color:var(--accent-color);">Relatório Geral Academia</h2>
                    <button onclick="downloadGeneralPDF()" style="background:transparent; color:#ff4757; border:1px solid #ff4757; border-radius:50%; width:40px; height:40px; cursor:pointer;">PDF</button>
                </div>
                <div class="report-grid">
                    <div class="report-section"><strong>Alunos Ativos:</strong><br>${sheetDataCache.students.length} matriculados</div>
                    <div class="report-section"><strong>Financeiro (${month}):</strong><br>${pagosCount} pagamentos feitos</div>
                    <div class="report-section"><strong>Total Presenças:</strong><br>${presCount} registros totais</div>
                </div>
            </div>`;
        document.getElementById('reportPreviewContainer').innerHTML = html;
    }

    async function downloadPDF(id) {
        const aluno = sheetDataCache.students.find(s => s.id == id);
        const { jsPDF } = window.jspdf;
        const doc = new jsPDF();
        doc.setFontSize(22); doc.text(`Physique - Relatório Individual`, 20, 20);
        doc.setFontSize(14); doc.text(`Aluno: ${aluno.nome}`, 20, 40);
        doc.text(`Status Financeiro: Mensalidade Ok`, 20, 50);
        doc.text(`Presenças Totais: ${sheetDataCache.attendances.filter(a => a.aid == id).length}`, 20, 60);
        doc.save(`Relatorio_${aluno.nome}.pdf`);
    }

    async function downloadGeneralPDF() {
        const { jsPDF } = window.jspdf;
        const doc = new jsPDF();
        doc.setFontSize(22); doc.text(`Physique - Relatório Geral`, 20, 20);
        doc.setFontSize(14); doc.text(`Total Alunos: ${sheetDataCache.students.length}`, 20, 40);
        doc.save(`Relatorio_Geral_Academia.pdf`);
    }

    // UTILITÁRIOS
    function openModal(id) { document.getElementById(id).style.display = 'flex'; }
    function closeModal(id) { document.getElementById(id).style.display = 'none'; }
    function escapeHtml(s) { return s ? s.replace(/[&<>]/g, t => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[t] || t)) : ''; }
    function updateSelects() { ['studentSelectObs', 'studentSelectEval', 'studentSelectReportPDF'].forEach(id => { const el = document.getElementById(id); if(el) el.innerHTML = '<option value="">-- Aluno --</option>' + sheetDataCache.students.map(s => `<option value="${s.id}">${escapeHtml(s.nome)}</option>`).join(''); }); }
    async function addStudent() { const n = document.getElementById('studentName').value; if(!n) return; await fetch(`https://sheets.googleapis.com/v4/spreadsheets/${spreadsheetId}/values/${SHEET_NAMES.STUDENTS}!A:A:append?valueInputOption=USER_ENTERED`, { method: 'POST', headers: { Authorization: `Bearer ${accessToken}`, 'Content-Type': 'application/json' }, body: JSON.stringify({ values: [[`s_${Date.now()}`, n, document.getElementById('studentPhone').value, document.getElementById('studentGoal').value, new Date().toISOString()]] }) }); closeModal('modalNewStudent'); await loadData(); }
    async function addObservation() { const id = document.getElementById('studentSelectObs').value; const txt = document.getElementById('observationText').value; if(!id || !txt) return; await fetch(`https://sheets.googleapis.com/v4/spreadsheets/${spreadsheetId}/values/${SHEET_NAMES.OBSERVATIONS}!A:A:append?valueInputOption=USER_ENTERED`, { method: 'POST', headers: { Authorization: `Bearer ${accessToken}`, 'Content-Type': 'application/json' }, body: JSON.stringify({ values: [[`o_${Date.now()}`, id, new Date().toISOString(), txt]] }) }); closeModal('modalObservation'); await loadData(); }
    function showObsPreview(id) { const obs = sheetDataCache.observations.filter(o => o.aid == id).slice(-2); const cont = document.getElementById('obsPreview'); if(obs.length === 0) cont.innerText = "Nenhuma nota."; else cont.innerHTML = obs.map(o => `📌 ${o.texto}`).join('<br>'); }
    async function saveEvaluation() { const id = document.getElementById('studentSelectEval').value; const p = document.getElementById('evalPeso').value; const a = document.getElementById('evalAltura').value; if(!id || !p || !a) return; const imc = (p / ((a/100)*(a/100))).toFixed(1); await fetch(`https://sheets.googleapis.com/v4/spreadsheets/${spreadsheetId}/values/${SHEET_NAMES.EVALUATIONS}!A:A:append?valueInputOption=USER_ENTERED`, { method: 'POST', headers: { Authorization: `Bearer ${accessToken}`, 'Content-Type': 'application/json' }, body: JSON.stringify({ values: [[`ev_${Date.now()}`, id, new Date().toISOString().slice(0,10), p, a, imc, document.getElementById('evalCintura').value, document.getElementById('evalQuadril').value]] }) }); closeModal('modalEvaluation'); await loadData(); }
    window.onload = initializeGoogleLogin;
</script>
</body>
